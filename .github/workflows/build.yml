name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and test
        run: |
          chmod +x build.sh scripts/verify-jar.sh
          ./build.sh -Pminecraft_version=26.2 -Pfabric_api_version=0.161.0+26.2
      - name: Verify jar
        run: bash scripts/verify-jar.sh 26.2
      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: escape-26.2
          path: build/libs/escape-*.jar
          if-no-files-found: error
